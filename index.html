<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Curry Leaves</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;450;500;550;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- Apply the saved theme before first paint so there's no flash (see theme.ts). -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('curry-leaves.theme') || 'system';
          if (t === 'system') {
            t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'sepia';
          }
          document.documentElement.dataset.theme = t;
        } catch (e) { /* ignore */ }
      })();
    </script>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
      /* Fallback bg for the brief moment before the bundled CSS (tokens) loads. */
      html { background: oklch(0.972 0.012 82); }
      html[data-theme="sepia"]    { background: oklch(0.955 0.022 75); }
      html[data-theme="default"] { background: oklch(0.962 0.009 84.6); }
      html[data-theme="dark"]     { background: oklch(0.205 0.012 80); }
      html[data-theme="midnight"] { background: oklch(0.185 0.026 258); }
      html[data-theme="mono"]     { background: oklch(1 0 0); }
      html[data-theme="noir"]     { background: oklch(0 0 0); }
      body {
        background: var(--color-bg);
        font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      #root { width: 100%; height: 100%; }
      button, input, textarea { font-family: inherit; }
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb {
        background: oklch(0 0 0 / 0.12); border-radius: 10px;
        border: 3px solid transparent; background-clip: padding-box;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/frontend/frontend.tsx"></script>
  </body>
</html>
