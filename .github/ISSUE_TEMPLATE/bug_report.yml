name: 🐛 Bug report
description: Report a bug in the Curry Leaves web UI
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug! This repo is the **web UI only**.
        If the problem is in backend behavior (API routes, agents, transcription,
        storage), please file it in
        [`curry-leaves-assistant`](https://github.com/Curry-Leaves/curry-leaves-assistant)
        instead.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you file
      options:
        - label: I searched existing issues and this isn't a duplicate.
          required: true
        - label: This is a UI bug (not backend behavior).
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what actually happened?
      placeholder: A screenshot helps a lot for UI bugs.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A minimal, ordered list of steps.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: input
    id: web-version
    attributes:
      label: Web UI version
      description: The curry-leaves-assistant-web version (see the app's About/settings or package.json).
      placeholder: "1.0.3"
    validations:
      required: true
  - type: input
    id: backend-version
    attributes:
      label: Backend version
      description: The curry-leaves-assistant version you're running against.
      placeholder: "e.g. 1.2.0"
    validations:
      required: false
  - type: input
    id: env
    attributes:
      label: Browser & OS
      placeholder: "e.g. Chrome 126 on macOS 15"
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console / network output
      description: Anything relevant from the browser console or network tab.
      render: shell
    validations:
      required: false
