name: ✨ Feature request
description: Propose a feature or improvement for the Curry Leaves web UI
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Please describe the **use case** before the solution —
        we prefer to agree on approach before code (see
        [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md)). This repo is the **web UI
        only**; backend features belong in
        [`curry-leaves-assistant`](https://github.com/Curry-Leaves/curry-leaves-assistant).
  - type: checkboxes
    id: checks
    attributes:
      label: Before you file
      options:
        - label: I searched existing issues and this isn't a duplicate.
          required: true
        - label: This is a UI feature (not backend behavior).
          required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case and who it helps.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? Sketches or mockups welcome.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, and why you set them aside.
    validations:
      required: false
